# Example Kitout config for schema version 1.
# This file is intended to stay valid against internal/config validation.

version: 1

brew:
  packages:
    - git
    - ruby
    - node
    - pnpm
    - gh

casks:
  - ghostty
  - visual-studio-code
  - rectangle

directories:
  - ~/code
  - ~/.config

repos:
  - path: ~/code/example-project
    url: git@github.com:example/example-project.git
    branch: main

symlinks:
  - source: ~/dotfiles/home/zshrc
    target: ~/.zshrc
    replace: false

macos_defaults:
  # Parsed and validated today; resource execution is planned.
  - domain: NSGlobalDomain
    key: AppleShowAllExtensions
    type: bool
    value: true

shell:
  - name: Enable Corepack
    command: corepack enable
    when: missing-command:pnpm
