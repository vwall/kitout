# Example Kitout config for schema version 1.
# This file is intended to stay valid against internal/config validation.

version: 1

brew:
  taps:
    - vwall/kitout
  packages:
    - git
    - asdf
    - pnpm
    - gh
    - fish
  casks:
    - ghostty
    - visual-studio-code
    - rectangle

asdf:
  plugins:
    - name: ruby
      url: https://github.com/asdf-vm/asdf-ruby.git
      update_before_install: true
      versions:
        - 3.3.6
    - name: nodejs
      url: https://github.com/asdf-vm/asdf-nodejs.git
      versions:
        - 22.12.0
  tool_versions:
    - path: ~/.tool-versions
      tools:
        ruby: 3.3.6
        nodejs: 22.12.0

directories:
  - ~/code
  - ~/.config
  # A setup repo can copy approved Codex skills into this directory.
  - ~/.codex/skills

repos:
  - path: ~/code/example-project
    url: git@github.com:example/example-project.git
    branch: main

copies:
  # Copies materialize real files or directories. Use this for Codex skills or
  # other content that should not be symlinked from the setup repo.
  - source: ./codex/skills/nuxt-practices
    target: ~/.codex/skills/nuxt-practices
    replace: false

symlinks:
  # Agents should edit this source file, not the managed target in $HOME.
  - source: ./home/zshrc
    target: ~/.zshrc
    replace: false

symlink_groups:
  # Relative paths resolve from this config file, which keeps dotfiles portable.
  - source_root: ./home
    target_root: "~"
    replace: false
    paths:
      - .gitconfig
      - .config/ghostty

macos_defaults:
  # Show all filename extensions in Finder and standard file panels.
  - domain: NSGlobalDomain
    key: AppleShowAllExtensions
    type: bool
    value: true

security:
  filevault:
    required: true
  firewall:
    enabled: true
    stealth_mode: true

system:
  xcode_command_line_tools:
    required: true
  rosetta:
    required: true

ssh:
  keys:
    - path: ~/.ssh/id_ed25519
      type: ed25519
      comment: user@example.com

login_shell:
  path: homebrew:fish
  add_to_etc_shells: true

shell:
  - name: Enable Corepack
    command: corepack enable
    when: missing-command:pnpm
