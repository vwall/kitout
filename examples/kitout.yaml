# Example Kitout config for schema version 1.
# This file is intended to stay valid against internal/config validation.

version: 1

brew:
  packages:
    - git
    - asdf
    - pnpm
    - gh

asdf:
  plugins:
    - name: ruby
      url: https://github.com/asdf-vm/asdf-ruby.git
      versions:
        - 3.3.6
    - name: nodejs
      url: https://github.com/asdf-vm/asdf-nodejs.git
      versions:
        - 22.12.0
  tool_versions:
    - path: ~/.tool-versions
      tools:
        ruby: 3.3.6
        nodejs: 22.12.0

casks:
  - ghostty
  - visual-studio-code
  - 1password

directories:
  - ~/code
  - ~/.config

repos:
  - path: ~/code/aubs
    url: git@github.com:vrwaller/aubs.git
    branch: main

symlinks:
  - source: ~/dotfiles/home/zshrc
    target: ~/.zshrc
    replace: false

macos_defaults:
  # Parsed and validated today; resource execution is planned.
  - domain: NSGlobalDomain
    key: AppleShowAllExtensions
    type: bool
    value: true

shell:
  - name: Enable Corepack
    command: corepack enable
    when: missing-command:pnpm
